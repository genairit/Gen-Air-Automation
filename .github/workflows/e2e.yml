name: End-to-end

on:
  workflow_call:
    inputs:
      automation-ref:
        type: string
        required: true
        description: Immutable Automation SHA matching this reusable workflow

permissions:
  contents: read
  statuses: write

jobs:
  revisions:
    name: Resolve release revisions
    if: ${{ github.repository == 'genairit/Gen-Air-Frontend' && github.event_name == 'pull_request' && github.base_ref == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend-ref: ${{ steps.revisions.outputs.backend-ref }}
      frontend-ref: ${{ steps.revisions.outputs.frontend-ref }}
    env:
      AUTOMATION_REF: ${{ inputs.automation-ref }}
    steps:
      - name: Check out Gen-Air-Automation
        uses: actions/checkout@v4
        with:
          repository: genairit/Gen-Air-Automation
          ref: ${{ env.AUTOMATION_REF }}
          persist-credentials: false
          path: Gen-Air-Automation

      - name: Validate frontend release and resolve backend
        id: revisions
        uses: actions/github-script@v7
        with:
          script: |
            const { prepare } = await import(`${process.env.GITHUB_WORKSPACE}/Gen-Air-Automation/.github/scripts/release-gate.mjs`);
            await prepare({ github, context, core });

  shards:
    name: Playwright shard ${{ matrix.shard }}
    needs: revisions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      AUTOMATION_REF: ${{ inputs.automation-ref }}
    steps:
      - name: Check out Gen-Air-Automation
        uses: actions/checkout@v4
        with:
          repository: genairit/Gen-Air-Automation
          ref: ${{ env.AUTOMATION_REF }}
          persist-credentials: false
          path: Gen-Air-Automation

      - name: Check out Gen-Air-Backend
        uses: actions/checkout@v4
        with:
          repository: genairit/Gen-Air-Backend
          ref: ${{ needs.revisions.outputs.backend-ref }}
          persist-credentials: false
          path: Gen-Air-Backend

      - name: Check out Gen-Air-Frontend
        uses: actions/checkout@v4
        with:
          repository: genairit/Gen-Air-Frontend
          ref: ${{ needs.revisions.outputs.frontend-ref }}
          persist-credentials: false
          path: Gen-Air-Frontend

      - name: Check out Gen-Air-Worker
        uses: actions/checkout@v4
        with:
          repository: genairit/Gen-Air-Worker
          ref: main
          persist-credentials: false
          path: Gen-Air-Worker

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Gen-Air-Automation/package-lock.json
            Gen-Air-Backend/package-lock.json
            Gen-Air-Frontend/package-lock.json
            Gen-Air-Worker/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix Gen-Air-Backend
          npm ci --prefix Gen-Air-Frontend
          npm ci --prefix Gen-Air-Worker
          npm ci --prefix Gen-Air-Automation

      - name: Install Chromium
        working-directory: Gen-Air-Automation
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        id: suite
        env:
          GEN_AIR_ARTIFACTS_DIR: ${{ runner.temp }}/gen-air-automation
          GEN_AIR_PDF_QA: "true"
        working-directory: Gen-Air-Automation
        timeout-minutes: 46
        run: |
          export CHROMIUM_EXECUTABLE_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --global-timeout=2700000

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/gen-air-automation/html
            ${{ runner.temp }}/gen-air-automation/test-results
            ${{ runner.temp }}/gen-air-automation/results.json
          retention-days: 14

  playwright:
    name: Playwright
    needs: [revisions, shards]
    if: ${{ always() && github.repository == 'genairit/Gen-Air-Frontend' && github.event_name == 'pull_request' && github.base_ref == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTOMATION_REF: ${{ inputs.automation-ref }}
    steps:
      - name: Check out Gen-Air-Automation
        uses: actions/checkout@v4
        with:
          repository: genairit/Gen-Air-Automation
          ref: ${{ env.AUTOMATION_REF }}
          persist-credentials: false
          path: Gen-Air-Automation

      - name: Require resolved release revisions
        if: ${{ needs.revisions.result != 'success' }}
        run: exit 1

      - name: Verify backend freshness and publish result
        if: ${{ needs.revisions.result == 'success' }}
        uses: actions/github-script@v7
        env:
          SUITE_OUTCOME: ${{ needs.shards.result }}
          TESTED_BACKEND_REF: ${{ needs.revisions.outputs.backend-ref }}
        with:
          script: |
            const { finish } = await import(`${process.env.GITHUB_WORKSPACE}/Gen-Air-Automation/.github/scripts/release-gate.mjs`);
            await finish({ github, context, core });
