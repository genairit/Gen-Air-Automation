name: End-to-end

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      repository-under-test:
        type: string
        required: true
        description: Gen-Air-Backend or Gen-Air-Frontend
      ref-under-test:
        type: string
        required: true
        description: Commit of the repository under test; the other app runs at dev

permissions:
  contents: read

env:
  BACKEND_REF: ${{ inputs.repository-under-test == 'Gen-Air-Backend' && inputs.ref-under-test || 'dev' }}
  FRONTEND_REF: ${{ inputs.repository-under-test == 'Gen-Air-Frontend' && inputs.ref-under-test || 'dev' }}
  AUTOMATION_REF: ${{ inputs.repository-under-test && 'main' || github.head_ref || github.ref }}

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Gen-Air-Automation
        uses: actions/checkout@v4
        with:
          repository: kfirmr/Gen-Air-Automation
          ref: ${{ env.AUTOMATION_REF }}
          path: Gen-Air-Automation

      - name: Check out Gen-Air-Backend
        uses: actions/checkout@v4
        with:
          repository: kfirmr/Gen-Air-Backend
          ref: ${{ env.BACKEND_REF }}
          path: Gen-Air-Backend

      - name: Check out Gen-Air-Frontend
        uses: actions/checkout@v4
        with:
          repository: kfirmr/Gen-Air-Frontend
          ref: ${{ env.FRONTEND_REF }}
          path: Gen-Air-Frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Gen-Air-Automation/package-lock.json
            Gen-Air-Backend/package-lock.json
            Gen-Air-Frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix Gen-Air-Backend
          npm ci --prefix Gen-Air-Frontend
          npm ci --prefix Gen-Air-Automation

      - name: Install Chromium
        working-directory: Gen-Air-Automation
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: Gen-Air-Automation
        run: npx playwright test

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            Gen-Air-Automation/playwright-report
            Gen-Air-Automation/test-results
          retention-days: 14
